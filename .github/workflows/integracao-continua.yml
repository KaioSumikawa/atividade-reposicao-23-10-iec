name: Monorepo CI Pipeline

on:
  # Dispara ao enviar novos commits para a branch main
  push:
    branches:
      - main

  # Dispara na abertura ou atualização de Pull Requests para main
  pull_request:
    branches:
      - main

  # Permite execução manual pelo GitHub Actions
  workflow_dispatch:

# Cancela execuções anteriores na mesma branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Validações, testes e análise de qualidade
  validacoes-e-testes:
    name: 1. Qualidade, Tipos, Testes e SonarQube
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Habilitar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 4. Instalar dependências do backend
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: 5. Validar código com ESLint
        working-directory: backend
        run: pnpm run lint

      - name: 6. Validar formatação com Prettier
        working-directory: backend
        run: pnpm run format:check

      - name: 7. Verificar tipos do TypeScript
        working-directory: backend
        run: pnpm run type-check

      - name: 8. Executar testes com Vitest
        working-directory: backend
        run: pnpm run test:coverage

      - name: 9. Analisar código com SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=kaiosumikawa
            -Dsonar.projectKey=KaioSumikawa_atividade-reposicao-23-10-iec
            -Dsonar.sources=backend/src
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      - name: 10. Publicar resumo da execução
        if: always()
        run: |
          echo "## Relatório de CI e cobertura de código" >> "$GITHUB_STEP_SUMMARY"
          echo "Execução referente ao commit `${{ github.sha }}`." >> "$GITHUB_STEP_SUMMARY"
          echo "As verificações de código, os testes e a análise de qualidade foram executados conforme o resultado das etapas anteriores." >> "$GITHUB_STEP_SUMMARY"

      - name: 11. Salvar relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-backend
          path: backend/coverage
          retention-days: 14
          if-no-files-found: ignore

  # Job 2: Validação da imagem Docker
  validar-build-docker:
    name: 2. Validação de Build do Docker
    needs: [validacoes-e-testes]
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4

      - name: 2. Validar o build do Docker
        run: docker build -t api-service:smoke-test ./backend

      - name: 3. Publicar resumo da execução
        run: |
          echo "## Resumo do pipeline de CI" >> "$GITHUB_STEP_SUMMARY"
          echo "Build da imagem Docker concluído com sucesso." >> "$GITHUB_STEP_SUMMARY"
          echo "- Autor: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
